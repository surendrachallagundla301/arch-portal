server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: arch-portal-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/archportal}
    username: ${DB_USER:archportal}
    password: ${DB_PASSWORD:archportal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # The token's "iss" must match this (the URL the browser used to sign in)...
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/arch-portal}
          # ...while signing keys are fetched over the internal network.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/arch-portal/protocol/openid-connect/certs}

portal:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cmdb:
    enabled: ${CMDB_ENABLED:true}
    base-url: ${CMDB_BASE_URL:http://localhost:9090}
    max-attempts: 3
    backoff-ms: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
