apiVersion: v1
kind: ConfigMap
metadata:
  name: arch-portal-api-config
  namespace: arch-portal
data:
  DB_URL: jdbc:postgresql://arch-portal-db.example.internal:5432/archportal
  KEYCLOAK_ISSUER_URI: https://sso.example.com/realms/arch-portal
  KEYCLOAK_JWK_SET_URI: https://sso.example.com/realms/arch-portal/protocol/openid-connect/certs
  CMDB_BASE_URL: https://cmdb.example.internal/api
  CORS_ALLOWED_ORIGINS: https://arch-portal.example.com
---
# Mounted into the web container as /usr/share/nginx/html/config.json, so the same image
# runs in every environment and a config change needs only a rollout, not a rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arch-portal-web-config
  namespace: arch-portal
data:
  config.json: |
    {
      "apiUrl": "https://arch-portal.example.com/api",
      "keycloak": {
        "url": "https://sso.example.com",
        "realm": "arch-portal",
        "clientId": "portal-frontend"
      }
    }
