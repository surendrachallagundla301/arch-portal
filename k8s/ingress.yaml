# AWS Load Balancer Controller: one ALB routes /api to the Spring Boot service and everything else to Angular.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arch-portal
  namespace: arch-portal
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/replace-me
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - host: arch-portal.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: arch-portal-api, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: arch-portal-web, port: { number: 80 } }
