server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache runtime config, so a ConfigMap change takes effect on reload.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Hashed build assets can be cached for a long time.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths fall back to index.html for the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
